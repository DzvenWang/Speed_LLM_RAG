project:
  project_root: /scratch/mh20/zw1165/Speed_LLM_RAG
  process_root: /scratch/mh20/zw1165/Speed_LLM_RAG/TraffiDent_SupportBench
  data_root: /scratch/mh20/zw1165/Speed_LLM_RAG/data
  benchmark_root: /scratch/mh20/zw1165/Speed_LLM_RAG/data/processed/traffident/supportbench
  diagnostics_root: /scratch/mh20/zw1165/Speed_LLM_RAG/data/diagnostics/traffident/supportbench
  derived_root: /scratch/mh20/zw1165/Speed_LLM_RAG/artifacts/supportbench

source:
  source_root: null
  expected_subgraphs:
    - TraffiDent_Net_01
    - TraffiDent_Net_02
    - TraffiDent_Net_03
    - TraffiDent_Net_04
    - TraffiDent_Net_06
  traffic_file: traffic_2024.npy
  nodes_file: nodes_target.csv
  adjacency_file: adj_target.npy
  distance_file: distance_target.npy
  channel_mapping_file: channel_mapping.json
  primary_channel: speed
  link_mode: symlink

forecast:
  history_len: 12
  horizon: 12
  freq_minutes: 5
  train_ratio: 0.70
  val_ratio: 0.10
  test_ratio: 0.20
  train_stride: 1
  val_stride: 1
  test_stride: 1
  controlled_complete_min_fraction: 1.0
  invalidate_synchronised_zero: true
  synchronised_zero_node_fraction: 0.95

sensing:
  global_seed: 20260905
  # General benchmark families. Predictive families are a separate support-oriented track.
  general_families:
    - entry_random
    - sensor_outage
    - temporal_outage
    - regional_outage
    - directional_outage
  predictive_families:
    - predictive_regional_outage
    - predictive_directional_outage
  severities: [0.20, 0.40, 0.60]
  predictive_severities: [0.40]
  main_severity: 0.40
  train_views_per_window: 4
  val_instances_per_family_severity: 1
  test_instances_per_family_severity: 1
  paired_main_instances: 2
  temporal_node_fraction: 0.75
  ood_severities: [0.40]

  regional_seen_fraction: 0.70
  regional_id_layouts_per_severity: 32
  regional_ood_layouts_per_severity: 16
  regional_min_id_layouts_per_severity: 16
  regional_min_ood_layouts_per_severity: 8

  directional_id_layouts_per_severity: 32
  directional_ood_layouts_per_severity: 16
  directional_min_id_layouts_per_severity: 16
  directional_min_ood_layouts_per_severity: 8

  # Predictive structured layouts directly optimise Train-only dependency
  # context loss under topology/direction constraints (v1.2.2).
  predictive_center_pool_fraction: 0.35
  predictive_layout_exploration_temperature: 0.12
  predictive_regional_id_layouts_per_severity: 24
  predictive_regional_ood_layouts_per_severity: 12
  predictive_regional_min_id_layouts_per_severity: 8
  predictive_regional_min_ood_layouts_per_severity: 4
  predictive_directional_id_layouts_per_severity: 24
  predictive_directional_ood_layouts_per_severity: 12
  predictive_directional_min_id_layouts_per_severity: 8
  predictive_directional_min_ood_layouts_per_severity: 4

  effective_ratio_tolerance: 0.04
  regional_min_largest_component_fraction: 0.50

# Train-only graph/local dependency used ONLY to define predictive-context loss,
# predictive masks, support-dependent targets and structured evidence.
dependency:
  max_neighbors: 8
  max_lag_steps: 3
  sample_stride: 12
  min_pairs: 64
  corr_floor: 0.05
  graph_weight_mix: 0.20
  support_dependent_missing_threshold: 0.40
  support_dependent_target_observed_min: 0.50
  # Legacy v1.2.2 diagnostic only. Formal Chapter-3 C_q^loss is the network
  # mean of per-target context loss, not this quantile.
  context_loss_quantile: 0.75
  # Diagnostic only: predictive structured masks should remove more Train-defined
  # predictive context than their general counterparts on matched Test windows.
  predictive_context_diagnostic_views: 512
  predictive_context_min_ratio: 1.05
  predictive_context_strict: false

memory:
  # Main RAG archive is intentionally denser than v1.1.x: one episode per 30 min.
  episode_stride: 6
  local_patch_hops: 1
  local_patch_max_nodes: 16
  include_target: true
  train_only: true
  strict_temporal_exclusion: true
  formal_memory_budget: full
  development_memory_budget: development

budgets:
  development_train_windows: 12000
  development_val_windows: 5000
  development_test_windows: 5000
  selection: uniform_temporal

tracks:
  general:
    families: [entry_random, sensor_outage, temporal_outage, regional_outage, directional_outage]
    severities: [0.20, 0.40, 0.60]
  main_support:
    families: [temporal_outage, regional_outage, directional_outage]
    severity: 0.40
  support_challenge:
    # Challenge source queries are future-free. v2 builds structural features here
    # and fits the final Support Opportunity calibrator from Validation realised
    # safe headroom only; Test applies the frozen Validation calibrator.
    source_families:
      - temporal_outage
      - regional_outage
      - directional_outage
      - predictive_regional_outage
      - predictive_directional_outage
    severity: 0.40
    high_quantile: 0.70
    low_quantile: 0.30
    # Deprecated v1 handcrafted score weights. Kept only for backward-compatible
    # legacy diagnostics; formal SO-v2 does not use them.
    context_loss_weight: 0.45
    retrieval_ambiguity_weight: 0.35
    memory_coverage_weight: 0.20
    softmax_temperature: 0.10
    coverage_q_low: 0.10
    coverage_q_high: 0.90
    # Legacy v1 quantile-scaling settings. Formal SO-v2 replaces clipped linear
    # scaling with a tie-aware Validation family-wise empirical percentile.
    context_q_low: 0.10
    context_q_high: 0.90
    # Diagnostic only; does not rebalance or filter Test queries automatically.
    max_high_family_fraction_warning: 0.50


# Final Support Opportunity v2 is outcome-calibrated on Validation only.
# Inference/Test inputs remain future-free. Retrieval ambiguity is deliberately
# excluded because it measures candidate-selection difficulty, not opportunity.
support_opportunity_v2:
  feature_names:
    - predictive_context_percentile
    - support_scope
    - memory_coverage_percentile
    - context_scope_interaction
  target_key: oracle_safe_global_relative_gain
  calibration_model: ridge_oof
  cv_folds: 5
  ridge_alphas: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  retrieval_difficulty_feature: retrieval_difficulty
  include_retrieval_difficulty_in_opportunity: false

retrieval:
  canonical_candidate_k: 64
  # Large candidate set used only for I1 training-label mining. Formal retrieval
  # evaluation still starts from the full Train memory and reports Top-K.
  training_mining_k: 256
  training_mining_per_view_k: 96
  training_mining_diverse_k: 64
  reasoner_candidate_k: 8
  mode: multi_view
  per_view_recall_k: 24
  views: [temporal, spatial, propagation]
  view_weights:
    temporal: 0.30
    spatial: 0.30
    propagation: 0.40

reasoning:
  anchor_nodes: 3
  primary_gain_key: gain_support_dependent
  global_safety_tolerance_mae: 0.0
  propagation_max_lag: 3
  missing_anchor_preference: true
  hard_negative_types:
    - similarity_conflict
    - temporal_match_propagation_mismatch
    - redundant_support

support_utility:
  primary_mode: residual
  primary_gain_key: gain_support_dependent
  global_safety_tolerance_mae: 0.0
  direct_masked_missing_threshold: 0.0
  alpha_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50]
  alpha_selection_rule: similarity_top1

explanation:
  evidence_pairs_per_split: 512
  contrastive_pairs_per_split: 256
