project:
  root: ${SPEED_LLM_RAG_ROOT}
  baseline_root: ${SPEED_LLM_RAG_ROOT}/Baseline
  log_root: ${SPEED_LLM_RAG_ROOT}/Baseline_logs/${TRAFFIDENT_TARGET}
  exp_root: ${SPEED_LLM_RAG_ROOT}/Baseline_exps/${TRAFFIDENT_TARGET}
  supportbench_project: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench
  benchmark_root: ${SPEED_LLM_RAG_ROOT}/data/processed/traffident/base_supportbench/${TRAFFIDENT_TARGET}
  support_artifact_root: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts
  backbone_root: ${SPEED_LLM_RAG_ROOT}/Backbone
  backbone_exp_root: ${SPEED_LLM_RAG_ROOT}/Backbone_exps
  python: python
  leaf_python: python
  protocol_root: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench
  protocol_artifact_root: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/protocol/${TRAFFIDENT_TARGET}
  common_root: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench
experiment:
  subgraph: TraffiDent_Net_06
  target: ${TRAFFIDENT_TARGET}
  history: 12
  horizon: 12
  severity: 0.4
  seed: 10
  formal_seeds:
  - 10
  families:
  - entry_random
  - sensor_outage
  - temporal_outage
  - regional_outage
  - directional_outage
  evaluation_severities:
  - 20
  - 40
  - 60
  - 90
reference_backbone:
  selection_mode: explicit_model_direct_checkpoint_resolution
  train_mode_default: incomplete  # overridden by BACKBONE_TRAIN_MODE / --backbone-train-mode
  seed: 10
  supported_models:
  - STAEformer
  - HimNet
  - BigST
  - STDN
  - PatchSTG
  - STLAformer
  checkpoint_override_env: BASELINE_BACKBONE_CHECKPOINT

protocol:
  official_source_policy: exact_commit_or_first_run_resolved_commit_then_tree_sha256_lock
  test_selection_policy: direct_multiseverity_evaluation_after_completed_formal_run_no_baseline_freeze
  prediction_contract: raw_target_Mx12xN
  retrieval_memory: train_only
  retrieval_memory_signal: full_train_history
  retrieval_query_signal: incomplete_query_history
  current_query_future_allowed_at_inference: false
  same_reference_backbone_for_reconstruction_and_matched_rag: true
  cache_fingerprint_required: true
  retrieval_audit_required: true
  shared_protocol_name: base_core5_${TRAFFIDENT_TARGET}_s40
  shared_protocol_version: 2.1.0
  consumer_policy: shared_protocol_only
  no_local_sampling: true
  reference_backbone_required_for:
  - ImputeFormer
  - LRTC-TMCP
  - SPRINT
  - RAST-STLAformer
  - RAFT-STLAformer
  paired_group_id: TraffiDent_Net_06_base_core5_${TRAFFIDENT_TARGET}_multiseverity_v1
  evaluation_protocol_names:
    20: base_core5_${TRAFFIDENT_TARGET}_s20
    40: base_core5_${TRAFFIDENT_TARGET}_s40
    60: base_core5_${TRAFFIDENT_TARGET}_s60
    90: base_core5_${TRAFFIDENT_TARGET}_s90
baseline_story:
  main_table:
  - ImputeFormer
  - LRTC-TMCP
  - GinAR
  - RAFT
  - RAST
  - SARAF
  - ReMFT
  llm_specific: []
  specialized_reconstruction_subtrack:
  - SPRINT
  partial_sensing_subtrack:
  - SLPF
  - MoGERNN
  claim_chain:
  - reconstruction_first_deep
  - reconstruction_first_recent_trc_tensor_completion
  - missing_aware_end_to_end
  - generic_similarity_retrieval
  - traffic_spatiotemporal_retrieval
  - retrieval_reliability_control
  - llm_direct_traffic_forecasting_reference
  - predictive_support_reasoning_and_control
  secondary_experiments:
  - SPRINT
  - SLPF
  - MoGERNN
  - LEAF
  - LEAF-Qwen1.5B
  - RAST-PatchSTG
  - RAST-STLAformer
  - RAFT-PatchSTG
  - RAFT-STLAformer
  - SARAF-PatchSTG
methods:
  ImputeFormer:
    enabled: true
    table_group: main
    priority: 1
    formal_track: reconstruction_then_selected_reference_backbone
    stage_now: development_then_formal_from_clean_slate
    requires_reference_backbone_for_final_forecast: true
    primary_experiment: true
  GinAR:
    enabled: true
    table_group: main
    priority: 3
    formal_track: end_to_end_variable_missing_forecasting
    stage_now: formal_stability_probe_then_development_then_formal
    requires_reference_backbone_for_final_forecast: false
    primary_experiment: true
  RAFT:
    enabled: true
    table_group: main
    priority: 4
    formal_track: generic_retrieval_external_val_only_runner_train_memory_only
    stage_now: development_then_formal_from_clean_slate
    requires_reference_backbone_for_final_forecast: false
    primary_experiment: true
  RAST:
    enabled: true
    table_group: main
    priority: 5
    formal_track: traffic_rag_native_external_val_only_runner
    stage_now: development_then_formal_from_clean_slate
    requires_reference_backbone_for_final_forecast: false
    primary_experiment: true
  SARAF:
    enabled: true
    table_group: main
    priority: 6
    formal_track: stationarity_aware_retrieval_external_val_only_runner_train_memory_only
    stage_now: development_then_formal_from_clean_slate
    requires_reference_backbone_for_final_forecast: false
    primary_experiment: true
  LEAF:
    enabled: true
    table_group: secondary
    priority: 7
    formal_track: llm_framework_reference
    stage_now: qwen15_predict_select_supervise_ready
    requires_reference_backbone_for_final_forecast: false
    primary_experiment: false
  LEAF-Qwen1.5B:
    enabled: true
    table_group: secondary
    priority: 7
    formal_track: leaf_qwen15_predict_select_supervise_adaptation
    stage_now: development_ready_after_leaf_branches
    requires_reference_backbone_for_final_forecast: false
    primary_experiment: false
  SLPF:
    enabled: true
    table_group: secondary
    priority: 9
    formal_track: matched_fixed_partial_sensing_subtrack
    stage_now: official_native_subtrack_bridge_and_smoke
    requires_reference_backbone_for_final_forecast: false
    primary_experiment: false
  RAST-PatchSTG:
    enabled: true
    table_group: secondary
    priority: 11
    formal_track: traffic_rag_matched_patchstg_reference_controlled_adaptation
    stage_now: formal_seed10_ready
    requires_reference_backbone_for_final_forecast: true
    primary_experiment: false
    formal_seeds:
    - 10
  RAST-STLAformer:
    enabled: true
    table_group: secondary
    priority: 11
    formal_track: traffic_rag_matched_stlaformer_reference_controlled_adaptation
    stage_now: formal_seed10_ready
    requires_reference_backbone_for_final_forecast: true
    primary_experiment: false
    formal_seeds:
    - 10
  RAFT-STLAformer:
    enabled: true
    table_group: secondary
    priority: 12
    formal_track: raft_retrieval_matched_stlaformer_reference_control
    stage_now: formal_seed10_ready
    requires_reference_backbone_for_final_forecast: true
    primary_experiment: false
    formal_seeds:
    - 10
  SPRINT:
    enabled: true
    table_group: secondary
    priority: 2
    formal_track: causal_historical_day_sprint_imputation_then_selected_reference_backbone
    stage_now: development_runner_causal_history_vendor_native_pending_smoke
    requires_reference_backbone_for_final_forecast: true
    primary_experiment: false
  MoGERNN:
    enabled: true
    table_group: secondary
    priority: 10
    formal_track: official_mogernn_dynamic_view_batch1_adaptation
    stage_now: development_pending_inference_contract_check
    requires_reference_backbone_for_final_forecast: false
    primary_experiment: false
  ReMFT:
    enabled: true
    table_group: main
    priority: 7
    formal_track: official_remft_native96_incomplete_sensing_external_val_only
    stage_now: native96_runtime_contract_then_rerun_development_and_formal
    requires_reference_backbone_for_final_forecast: false
    primary_experiment: true
  LRTC-TMCP:
    enabled: true
    table_group: main
    priority: 2
    formal_track: causal_multiday_lrtc_tmcp_imputation_then_selected_reference_backbone
    stage_now: causal_multiday_contract_smoke_then_rerun_development_and_formal_seed10
    requires_reference_backbone_for_final_forecast: true
    deterministic: true
    formal_seeds:
    - 10
    primary_experiment: true
  RAFT-PatchSTG:
    enabled: true
    table_group: secondary
    priority: 12
    formal_track: raft_retrieval_matched_patchstg_reference_control
    stage_now: formal_seed10_ready
    requires_reference_backbone_for_final_forecast: true
    primary_experiment: false
    formal_seeds:
    - 10
  SARAF-PatchSTG:
    enabled: true
    table_group: secondary
    priority: 13
    formal_track: saraf_retrieval_matched_patchstg_reference_control
    stage_now: formal_seed10_ready
    requires_reference_backbone_for_final_forecast: false
    primary_experiment: false
    formal_seeds:
    - 10
runners:
  RAFT:
    batch_size: 32
    max_epochs: 10
    learning_rate: 0.0001
    patience: 10
    n_period: 3
    topm: 20
    # Matched-backbone controls only (PatchSTG/STLAformer). Start exactly from
    # the selected reference forecast and learn how much native RAFT fusion to admit.
    # Native RAFT is unchanged.
    reference_control_zero_init_residual_scale: true
    reference_control_residual_scale_init: 0.0
  GinAR:
    model_variant: model1
    batch_size: 16
    max_epochs: 100
    learning_rate: 0.006
    formal_learning_rate: 0.0005
    formal_lr_milestones:
    - 40
    - 70
    - 90
    formal_max_optimizer_updates: 75000
    divergence_guard_enabled: true
    divergence_guard_min_epoch: 2
    divergence_guard_ratio: 5.0
    divergence_guard_abs: 5.0
    dropout: 0.15
    emb_size: 16
    graph_size: 8
    layers: 2
    gradient_clip: 1.0
    lr_milestones:
    - 1
    - 15
    - 40
    - 70
    - 90
    lr_gamma: 0.5
    patience: 20
    input_features:
    - speed
    - tod
    - dow
    stability_probe_epochs: 8
    formal_validity_requires_no_divergence: true
  SARAF:
    batch_size: 32
    max_epochs: 20
    learning_rate: 0.001
    patience: 5
    n_period: 1
    topm: 20
    time_aware_weight: 0.3
    freq: 5min
    fusion_method: weighted
    features: M
    retrieval_precompute_batch_size: 1024
    train_only_memory: true
  ImputeFormer:
    batch_size: 32
    max_epochs: 120
    learning_rate: 0.001
    weight_decay: 0.0
    patience: 20
    gradient_clip: 5.0
    input_embedding_dim: 32
    learnable_embedding_dim: 96
    feed_forward_dim: 256
    num_temporal_heads: 4
    num_layers: 3
    dim_proj: 8
    dropout: 0.1
  RAST:
    batch_size: 32
    max_epochs: 100
    learning_rate: 0.002
    weight_decay: 0.0001
    patience: 20
    gradient_clip: 5.0
    dropout: 0.1
    query_dim: 256
    retrieval_dim: 128
    temporal_dim: 64
    spatial_dim: 64
    update_interval: 10
    encoder_layers: 3
    top_k: 3
    use_amp: false
    min_delta: 1.0e-08
    # Matched-backbone controls only (PatchSTG/STLAformer). Native RAST is unchanged.
    reference_control_zero_init_residual_scale: true
    reference_control_residual_scale_init: 0.0
    reference_control_min_delta: 1.0e-08
  LEAF:
    batch_size: 16
    max_epochs: 80
    learning_rate: 0.001
    weight_decay: 0.0001
    patience: 12
    gradient_clip: 5.0
    hidden_dim: 64
    dropout: 0.0
    stgcn_num_layers: 7
    hgnn_num_backbone_layers: 6
    hgnn_num_head_layers: 1
    hgnn_num_hyper_edge: 32
    qwen_selector:
      model_name: Qwen2.5-1.5B-Instruct
      model_cache_root: ${SPEED_LLM_RAG_ROOT}/model_cache/Qwen2.5-1.5B-Instruct
      snapshot: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
      local_files_only: true
      dtype: float16
      selector_batch_size: 32
      max_input_tokens: 2048
      max_new_tokens: 4
      fallback_choice: 1
      rounds: 2
      update_iters: 5
      test_learning_rate: 0.001
      test_weight_decay: 0.0
      checkpoint_every_queries: 25
      log_every_queries: 10
  SPRINT:
    device: CPU
    use_vendor_native_defaults: true
    zero_as_missing: false
    protect_observed_values: true
    historical_days: 28
    day_steps: 288
    canonical_target_match_mae_max: 0.05
    canonical_valid_agreement_min: 0.9999
    reference_backbone_batch_size: 32
  MoGERNN:
    batch_size: 1
    max_epochs: 50
    learning_rate: 0.001
    weight_decay: 0.0001
    patience: 3
    scheduler: plateau
    scheduler_patience: 1
    scheduler_factor: 0.5
    min_learning_rate: 1.0e-05
    gradient_clip: 5.0
    require_eval_target_independence: true
    d_model: 64
    e_layers: 2
    k_hop: 1
    num_used_experts: 3
    expert_list:
    - Mean
    - WMean
    - Max
    - Min
    - Diffusion
    dropout: 0.0
    epsilon_for_observed_zero: 1.0e-06
    eval_target_independence_atol: 1.0e-06
  ReMFT:
    batch_size: 1
    max_epochs: 20
    learning_rate: 0.0001
    weight_decay: 0.0
    patience: 5
    gradient_accumulation_steps: 24
    gradient_clip: 5.0
    native_seq_len: 96
    benchmark_query_history: 12
    native_prefix_policy: same_view_prefix_rematerialization_plus_exact_benchmark_tail
    patch_len: 16
    stride: 8
    phi_layers: 5
    down_sampling_window: 2
    down_sampling_layers: 2
    llm: BERT
    local_model_env: REMFT_BERT_PATH
    checkpoint_consistent_llm_depth: true
    require_exact_llm_checkpoint_architecture: true
    effective_batch_size: 24
    development_use_amp: false
    formal_batch_size: 1
    formal_eval_batch_size: 1
    formal_use_amp: true
    formal_budget_policy: fixed_optimizer_updates
    formal_max_optimizer_updates: 9000
    data_loader_workers: 2
    formal_gradient_accumulation_steps: 24
  LRTC-TMCP:
    batch_size: 64
    rho: 1.0e-05
    theta0: 0.2
    beta: 2.5
    gamma: 20.0
    factor: 1.05
    tol: 0.0001
    max_iter: 200
    smoke_max_iter: 3
    protect_observed_values: true
    tensor_layout: nodes_x_support_days_x_query_slots
    strict_h12_only: false
    use_raw_speed_space: true
    historical_days: 28
    support_policy: fixed_train_archive_same_slot
    heldout_support_forbidden: true
    day_steps: 288
    canonical_target_match_mae_max: 0.05
    canonical_valid_agreement_min: 0.9999
    extra_causal_context: true
protocol_assertions:
  development:
    train_rows: 12000
    val_rows: 5000
    per_family_train: 2400
    per_family_val: 1000
  formal:
    val_rows: 5000
    train_policy: all_eligible_unique_groups
    train_rows: 50000
    per_family_train: 10000
    per_family_val: 1000
  evaluation:
    test_rows: 5000
    per_family_test: 1000
