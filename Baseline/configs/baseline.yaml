  required_paired_group_id: TraffiDent_Net_06_base_core5_${TRAFFIDENT_TARGET}_multiseverity_v1
shared_contract:
  required_version: 1.2.1
  required_cache_schema_version: 3
  data_contract_revision: traffident_experiment_cache_v1
  time_feature_revision: traffident_time_features_v1
  metrics_revision: traffident_metrics_v2
  prediction_contract_revision: traffident_prediction_v1
  protocol_version: 2.1.0
  paired_group_id: TraffiDent_Net_06_base_core5_${TRAFFIDENT_TARGET}_multiseverity_v1
  configs:
    training: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_formal.yaml
    evaluation:
      s20: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_evaluation_s20.yaml
      s40: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_evaluation_s40.yaml
      s60: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_evaluation_s60.yaml
      s90: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_evaluation_s90.yaml
