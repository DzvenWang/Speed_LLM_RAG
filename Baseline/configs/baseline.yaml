  RAFT:
    batch_size: 32
    max_epochs: 10
    learning_rate: 0.0001
    patience: 10
    n_period: 3
    topm: 20
  GinAR:
    model_variant: model1
    batch_size: 16
    max_epochs: 100
    learning_rate: 0.006
    formal_learning_rate: 0.0005
    formal_lr_milestones:
    - 40
    - 70
    - 90
    formal_max_optimizer_updates: 75000
    divergence_guard_enabled: true
    divergence_guard_min_epoch: 2
    divergence_guard_ratio: 5.0
    divergence_guard_abs: 5.0
    dropout: 0.15
    emb_size: 16
    graph_size: 8
    layers: 2
    gradient_clip: 1.0
    lr_milestones:
    - 1
    - 15
    - 40
    - 70
    - 90
    lr_gamma: 0.5
    patience: 20
    input_features:
    - speed
    - tod
    - dow
    stability_probe_epochs: 8
    formal_validity_requires_no_divergence: true
  SARAF:
    batch_size: 32
    max_epochs: 20
    learning_rate: 0.001
    patience: 5
    n_period: 1
    topm: 20
    time_aware_weight: 0.3
    freq: 5min
    fusion_method: weighted
    features: M
    retrieval_precompute_batch_size: 1024
    train_only_memory: true
  ImputeFormer:
    batch_size: 32
    max_epochs: 120
    learning_rate: 0.001
    weight_decay: 0.0
    patience: 20
    gradient_clip: 5.0
    input_embedding_dim: 32
    learnable_embedding_dim: 96
    feed_forward_dim: 256
    num_temporal_heads: 4
    num_layers: 3
    dim_proj: 8
    dropout: 0.1
  RAST:
    batch_size: 32
    max_epochs: 100
    learning_rate: 0.002
    weight_decay: 0.0001
    patience: 20
    gradient_clip: 5.0
    dropout: 0.1
    query_dim: 256
    retrieval_dim: 128
    temporal_dim: 64
    spatial_dim: 64
    update_interval: 10
    encoder_layers: 3
    top_k: 3
    use_amp: false
    min_delta: 1.0e-08
  LEAF:
    batch_size: 16
    max_epochs: 80
    learning_rate: 0.001
    weight_decay: 0.0001
    patience: 12
    gradient_clip: 5.0
    hidden_dim: 64
    dropout: 0.0
    stgcn_num_layers: 7
    hgnn_num_backbone_layers: 6
    hgnn_num_head_layers: 1
    hgnn_num_hyper_edge: 32
    qwen_selector:
      model_name: Qwen2.5-1.5B-Instruct
      model_cache_root: /scratch/mh20/zw1165/cache/huggingface/models--Qwen--Qwen2.5-1.5B-Instruct
      snapshot: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
      local_files_only: true
      dtype: float16
      selector_batch_size: 32
      max_input_tokens: 2048
      max_new_tokens: 4
      fallback_choice: 1
      rounds: 2
      update_iters: 5
      test_learning_rate: 0.001
      test_weight_decay: 0.0
      checkpoint_every_queries: 25
      log_every_queries: 10
  SPRINT:
    device: CPU
    use_vendor_native_defaults: true
    zero_as_missing: false
    protect_observed_values: true
    historical_days: 28
    day_steps: 288
    canonical_speed_match_mae_max: 0.05
    canonical_valid_agreement_min: 0.9999
    patchstg_batch_size: 32
  MoGERNN:
    batch_size: 1
    max_epochs: 50
    learning_rate: 0.001
    weight_decay: 0.0001
    patience: 3
    scheduler: plateau
    scheduler_patience: 1
    scheduler_factor: 0.5
    min_learning_rate: 1.0e-05
    gradient_clip: 5.0
    require_eval_target_independence: true
    d_model: 64
    e_layers: 2
    k_hop: 1
    num_used_experts: 3
    expert_list:
    - Mean
    - WMean
    - Max
    - Min
    - Diffusion
    dropout: 0.0
    epsilon_for_observed_zero: 1.0e-06
    eval_target_independence_atol: 1.0e-06
  ReMFT:
    batch_size: 1
    max_epochs: 20
    learning_rate: 0.0001
    weight_decay: 0.0
    patience: 5
    gradient_accumulation_steps: 24
    gradient_clip: 5.0
    patch_len: 4
    stride: 2
    phi_layers: 5
    down_sampling_window: 2
    down_sampling_layers: 2
    llm: BERT
    local_model_env: REMFT_BERT_PATH
    checkpoint_consistent_llm_depth: true
    require_exact_llm_checkpoint_architecture: true
  LRTC-TMCP:
    batch_size: 64
    rho: 1.0e-05
    theta0: 0.2
    beta: 2.5
    gamma: 20.0
    factor: 1.05
    tol: 0.0001
    max_iter: 200
    smoke_max_iter: 3
    protect_observed_values: true
    tensor_layout: nodes_x_single_query_day_x_history
    strict_h12_only: true
    use_raw_speed_space: true
