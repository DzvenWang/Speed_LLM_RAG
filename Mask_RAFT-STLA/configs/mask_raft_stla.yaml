version: 1.0.0
project:
  root: ${SPEED_LLM_RAG_ROOT}
  backbone_root: ${SPEED_LLM_RAG_ROOT}/Backbone
  supportbench_root: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench
  exp_root: ${SPEED_LLM_RAG_ROOT}/Mask_RAFT-STLA_exps/${TRAFFIDENT_TARGET}
  log_root: ${SPEED_LLM_RAG_ROOT}/Mask_RAFT-STLA_logs/${TRAFFIDENT_TARGET}
  retrieval_root: ${SPEED_LLM_RAG_ROOT}/Mask_RAFT-STLA_cache/${TRAFFIDENT_TARGET}
experiment:
  dataset: TraffiDent_Net_06
  target: ${TRAFFIDENT_TARGET}
  seed: 10
  history: 12
  horizon: 12
  severities: [20, 40, 60, 90]
backbone:
  model: STLAformer
  checkpoint_env: MASK_RAFT_STLA_BACKBONE_CHECKPOINT
  reference_seed: 10
  mask_features: [observed, node_coverage, time_coverage, missing_age]
retrieval:
  periods: [4, 2, 1]
  top_k: 20
  temperature: 0.10
  coverage_gamma: 0.5
  query_batch_size: 64
  memory_chunk_size: 1024
  overlap_exclusion: true
  min_valid_features: 8
model:
  period_hidden: 32
  latent_gate_dim: 8
  fusion_hidden: 64
  dropout: 0.10
  gate_bias: -2.0
training:
  batch_size: 16
  fallback_batch_sizes: [8, 4]
  max_epochs: 80
  patience: 20
  warmup_epochs: 10
  partial_epochs: 35
  partial_last_layers: 2
  lr_new: 0.001
  lr_backbone: 0.00005
  weight_decay: 0.0001
  grad_clip: 5.0
  forecast_loss: huber
  retrieval_aux_weight: 0.20
  gate_reg_weight: 0.0005
  min_delta: 0.00000001
runtime:
  num_workers: 0
  amp: false
  print_every: 100
