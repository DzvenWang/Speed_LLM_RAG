version: 0.2.1
project:
  exp_root: ${SPEED_LLM_RAG_ROOT}/FARE_exps
  artifact_root: ${SPEED_LLM_RAG_ROOT}/FARE_artifacts
  log_root: ${SPEED_LLM_RAG_ROOT}/FARE_logs
experiment:
  dataset: TraffiDent_Net_06
  backbone: STLAformer
  seed: 10
  history: 12
  horizon: 12
  train_severity: 40
  evaluation_severities: [40, 90]
  families: [entry_random, sensor_outage, temporal_outage, regional_outage, directional_outage]
runtime:
  inference_batch_size: 64
  num_workers: 0
  amp: false
  diagnostic_rows: 100
  smoke_rows: 20
  device: auto
training:
  context:
    batch_size: 32
    max_epochs: 50
    smoke_epochs: 2
    learning_rate: 0.0005
    weight_decay: 0.0001
    patience: 10
    gradient_clip: 5.0
    reconstruction_weight: 1.0
    forecast_weight: 0.50
    hidden_dim: 128
    num_layers: 4
    num_heads: 8
    dropout: 0.10
    ff_mult: 4
  retrieval:
    batch_size: 32
    max_epochs: 40
    smoke_epochs: 2
    learning_rate: 0.0005
    weight_decay: 0.0001
    patience: 8
    gradient_clip: 5.0
    reconstruction_weight: 1.0
    forecast_weight: 0.75
    top_k: 16
    search_k: 64
    memory_rows: 50000
    embedding_batch_size: 128
    fusion_hidden: 128
    dropout: 0.10
  backbone_aware:
    batch_size: 24
    max_epochs: 40
    smoke_epochs: 2
    learning_rate: 0.0004
    weight_decay: 0.0001
    patience: 8
    gradient_clip: 5.0
    reconstruction_weight: 0.75
    forecast_weight: 1.00
    residual_weight: 0.02
    hidden_dim: 128
    num_layers: 4
    num_heads: 8
    dropout: 0.10
    ff_mult: 4
structural:
  historical_days: 28
  day_steps: 288
  rho: 0.00001
  theta0: 0.20
  beta: 2.5
  gamma: 20.0
  factor: 1.05
  tol: 0.0001
  max_iter: 200
  smoke_max_iter: 3
  decomposition: gram_eigh
  batch_size: 8
