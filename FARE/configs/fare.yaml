version: 0.2.4
project:
  exp_root: ${SPEED_LLM_RAG_ROOT}/FARE_exps
  artifact_root: ${SPEED_LLM_RAG_ROOT}/FARE_artifacts
  log_root: ${SPEED_LLM_RAG_ROOT}/FARE_logs
experiment:
  dataset: TraffiDent_Net_06
  backbone: STLAformer
  seed: 10
  history: 12
  horizon: 12
  train_severity: 40
  evaluation_severities: [40, 90]
  families: [entry_random, sensor_outage, temporal_outage, regional_outage, directional_outage]
runtime:
  inference_batch_size: 64
  num_workers: 0
  amp: false
  diagnostic_rows: 100
  smoke_rows: 20
  device: auto
intervention_landscape:
  alpha_grid: [0.0, 0.25, 0.50, 0.75, 1.0]
  train_rows: 4000
  val_rows: 1200
  smoke_train_rows: 160
  smoke_val_rows: 80
  label_batch_size: 8
  utility_scale: 100.0
  curve_weight: 1.0
  choice_weight: 0.75
  pairwise_weight: 0.35
  reliability_weight: 0.50
  forecast_weight: 1.0
  no_harm_weight: 1.0
  pairwise_min_utility_gap: 0.0001
  choice_temperature: 1.0
training:
  context:
    batch_size: 32
    stage_a_max_epochs: 40
    stage_b_max_epochs: 15
    smoke_stage_a_epochs: 2
    smoke_stage_b_epochs: 2
    learning_rate: 0.0005
    controller_learning_rate: 0.0008
    weight_decay: 0.0001
    patience: 8
    gradient_clip: 5.0
    reconstruction_weight: 1.0
    raw_forecast_weight: 0.75
    raw_utility_weight: 0.50
    no_harm_margin: 0.0
    hidden_dim: 128
    num_layers: 4
    num_heads: 8
    dropout: 0.10
    ff_mult: 4
  retrieval:
    batch_size: 24
    stage_a_max_epochs: 30
    stage_b_max_epochs: 15
    smoke_stage_a_epochs: 2
    smoke_stage_b_epochs: 2
    learning_rate: 0.0005
    controller_learning_rate: 0.0008
    weight_decay: 0.0001
    patience: 8
    gradient_clip: 5.0
    reconstruction_weight: 0.75
    raw_forecast_weight: 1.00
    raw_utility_weight: 0.75
    no_harm_margin: 0.0
    ranking_weight: 0.50
    pairwise_min_utility_gap: 0.0001
    utility_label_k: 16
    smoke_utility_label_k: 8
    top_k: 32
    search_k: 64
    memory_rows: 50000
    embedding_batch_size: 128
    fusion_hidden: 128
    dropout: 0.10
    support_gate_init_bias: -1.5
  backbone_aware:
    batch_size: 20
    stage_a_max_epochs: 30
    stage_b_max_epochs: 15
    smoke_stage_a_epochs: 2
    smoke_stage_b_epochs: 2
    learning_rate: 0.0004
    controller_learning_rate: 0.0008
    weight_decay: 0.0001
    patience: 8
    gradient_clip: 5.0
    reconstruction_weight: 0.50
    raw_forecast_weight: 1.00
    raw_utility_weight: 0.75
    no_harm_margin: 0.0
    residual_weight: 0.02
    hidden_dim: 128
    num_layers: 4
    num_heads: 8
    dropout: 0.10
    ff_mult: 4
structural:
  historical_days: 28
  day_steps: 288
  rho: 0.00001
  theta0: 0.20
  beta: 2.5
  gamma: 20.0
  factor: 1.05
  tol: 0.0001
  max_iter: 200
  smoke_max_iter: 3
  decomposition: gram_eigh
  batch_size: 8
  calibration_rows: 80
  smoke_calibration_rows: 20
  alpha_grid: [0.0, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 1.0]
