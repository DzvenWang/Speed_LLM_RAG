version: 6.0.0
experiment:
  dataset: TraffiDent_Net_06
  target: speed
  seed: 10
  run_tag: formal
  train_limit: null
  val_limit: null
  test_limit: null
  sample_strategy: spread
  severities:
  - 20
  - 40
  - 60
  - 90
model:
  history: 12
  horizon: 12
  hidden_dim: 64
  alpha_max: 1.25
backbone:
  inject_layers:
  - 4
  - 5
traffic:
  region_size: 24
  neighbor_count: 4
  max_hops: 3
  path_sources: 16
  max_temporal_lag: 3
memory:
  max_episodes: 50000
  residual_mode: external_oos_paired
  require_oos_for_formal: true
  purge_steps: 12
  build_batch_size: 16
retrieval:
  coarse_k: 64
  shortlist_k: 16
  final_k: 8
  chunk_size: 4096
  temperature: 0.25
  gain_supervision: counterfactual_mae
teacher:
  support_queries: 512
  support_batch_size: 8
  max_queries: 512
  batch_size: 2
  nodes_per_query: 24
  refresh_every_epochs: 3
  candidates_per_query: 6
training:
  cuda_preflight: true
  batch_size: 32
  workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 5.0
  masked_weight: 0.2
  tail_weight: 0.02
  utility_weight: 0.2
  log_every: 50
  stage_epochs:
    support: 6
    utility: 8
    joint: 24
    risk: 8
    calibration: 5
  amp: true
  replay_interval: 8
  replay_batch: 2
  cache_gpu_memory: true
  gpu_cache_budget_gb: 5.0
  support_weight: 0.0
  support_teacher_weight: 0.05
evaluation:
  auto_evaluate: true
  include_val: false
analysis:
  enabled: false
  max_intervention_queries: 1024
  save_intervention_traces: false
  counterfactual_split: s40
  max_counterfactual_queries: 250
  bootstrap_samples: 1000
innovation_audit:
  required: true
  stage_enabled: true
  stage_queries: 32
  validation_queries: 512
  candidate_queries: 128
  stage_candidate_queries: 16
  stage_candidate_nodes: 16
  stage_candidate_slots: 4
  candidate_nodes: 32
  candidate_slots: 8
  candidate_alphas: [0.0, 0.1, 0.25, 0.5, 1.0]
  candidate_progress_every: 16
  progress_every_batches: 4
  bootstrap_samples: 1000
  seed: 10
  require_independent_retraining_for_publication: true
