# FARE v2.0.3 PILOT: 8k time-spread TRAIN; full validation; 16k train-only memory.
# Full model components + Forecast Utility + diagnostics. Validation selects checkpoint; Pilot Test is report-only.
version: 2.0.4
experiment:
  dataset: TraffiDent_Net_06
  target: speed
  seed: 10
  history: 12
  horizon: 12
  severities:
  - 20
  - 40
  - 60
  - 90
  max_train_rows: 8000
  max_val_rows: null
  run_tag: pilot
  train_sample_strategy: spread
model:
  hidden: 64
backbone:
  injection_layers:
  - 4
  - 5
  initialized_from_official_checkpoint: true
graph:
  target_region_size: 24
  max_anchors: 32
retrieval:
  key_dim: 128
  coarse_topk: 64
  topk: 8
  utility_score_weight: 0.8
  alignment_steps: 3
  match_on_observed_anchors_only: true
  exclude_overlapping_history_forecast: true
memory:
  max_rows: 16000
  sampling: spread
  latent_compression_dim: 32
  resident_device: cuda
innovation:
  memory_dim: 32
  rank: 16
  heads: 4
ranking:
  enabled: true
  target_temperature: 0.25
ablation:
  constant_alpha: 0.12
control:
  max_alpha: 0.6
  initial_alpha: 0.12
loss:
  retrieval: 0.4
  state: 0.1
  innovation: 0.03
  direct: 0.5
  tail: 0.03
  gate: 0.0005
  candidate: 0.08
  correction_energy: 0.003
  ranking: 0.15
training:
  batch_size: 32
  num_workers: 2
  grad_clip: 5.0
  weight_decay: 0.0001
  new_lr: 0.0001
  partial_backbone_lr: 2.0e-06
  full_backbone_lr: 1.0e-06
  stop_after_phase: injection
  freeze_retrieval_on_finetune: true
  finetune_new_lr: 2.0e-05
  patience: 4
  min_phase_epochs: 2
  phase_epochs:
    retrieval: 8
    recovery: 5
    injection: 12
    partial: 5
    full: 5
  oof_folds: 3
  oof_candidate_epochs: 5
  oof_controller_epochs: 10
  oof_nodes_per_window: 32
  oof_time_gap: 24
evaluation:
  save_stage_predictions: false
  save_final_predictions: true
  auto_test: true  # report-only in Pilot; does not participate in model selection
forecast_utility:
  enabled: true
  loss_weight: 0.2
  teacher_temperature: 0.35
  coarse_loss_weight: 0.35
  coarse_temperature: 0.7
  strict_causal_historical_future: true
performance:
  retrieval_phase_fast: true
  forecast_only_validation: true
  strict_batch_diagnostics: false
diagnostics:
  enabled: true
  sample_every_batches: 50
  max_sampled_batches: 160
  progress_every_batches: 500
