version: 6.0.0
experiment:
  dataset: TraffiDent_Net_06
  target: speed
  seed: 10
  run_tag: pilot
  train_limit: 8000
  val_limit: 2000
  test_limit: null
  sample_strategy: spread
  severities:
  - 20
  - 40
  - 60
  - 90
model:
  history: 12
  horizon: 12
  hidden_dim: 64
  alpha_max: 1.25
backbone:
  inject_layers:
  - 4
  - 5
traffic:
  region_size: 24
  neighbor_count: 4
  max_hops: 3
  path_sources: 16
  max_temporal_lag: 3
memory:
  max_episodes: 16000
  residual_mode: external_oos_paired
  require_oos_for_formal: true
  purge_steps: 12
  build_batch_size: 16
retrieval:
  coarse_k: 64
  shortlist_k: 16
  final_k: 8
  chunk_size: 4096
  temperature: 0.25
  gain_supervision: counterfactual_mae
teacher:
  support_queries: 128
  support_batch_size: 8
  max_queries: 128
  batch_size: 2
  nodes_per_query: 24
  refresh_every_epochs: 3
  candidates_per_query: 6
training:
  cuda_preflight: true
  batch_size: 32
  workers: 2
  amp: true
  support_weight: 0.02
  support_teacher_weight: 0.05
  replay_interval: 8
  replay_batch: 2
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 5.0
  masked_weight: 0.2
  tail_weight: 0.02
  utility_weight: 0.5
  log_every: 50
  stage_epochs:
    evidence: 2
    retrieval: 2
    joint: 2
    risk: 2
    calibration: 1
evaluation:
  auto_evaluate: true
  include_val: false
analysis:
  enabled: false
  max_intervention_queries: 256
  save_intervention_traces: false
  counterfactual_split: s40
  max_counterfactual_queries: 64
  bootstrap_samples: 300
innovation_audit:
  required: true
  stage_enabled: true
  stage_queries: 4
  validation_queries: 8
  candidate_queries: 4
  candidate_nodes: 4
  candidate_slots: 2
  bootstrap_samples: 100
  seed: 10
  require_independent_retraining_for_publication: true
