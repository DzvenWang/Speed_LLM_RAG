# FARE v2.1 clean configuration; old model checkpoints are incompatible.
version: 2.1.2
experiment:
  dataset: TraffiDent_Net_06
  target: speed
  seed: 10
  history: 12
  horizon: 12
  severities:
  - 20
  - 40
  - 60
  - 90
  max_train_rows: 8000
  max_val_rows: null
  run_tag: pilot
  train_sample_strategy: spread
model:
  hidden: 64
backbone:
  injection_layers:
  - 4
  - 5
  initialized_from_official_checkpoint: true
graph:
  target_region_size: 24
  max_anchors: 32
retrieval:
  key_dim: 128
  coarse_topk: 64
  shortlist_topk: 16
  topk: 8
  exclude_overlapping_history_forecast: true
memory:
  max_rows: 16000
  sampling: spread
  latent_compression_dim: 32
  resident_device: cuda
innovation:
  memory_dim: 32
training:
  batch_size: 32
  num_workers: 2
  grad_clip: 5.0
  weight_decay: 0.0001
  new_lr: 0.0001
  patience: 4
  min_phase_epochs: 2
  phase_epochs:
    evidence: 5
    retrieval: 8
    integration: 12
    control: 5
  stop_after_phase: null
  utility_teacher_holdout_fraction: 0.25
  teacher_purge_gap: 24
evaluation:
  save_stage_predictions: false
  save_final_predictions: true
  auto_test: true
  metrics_source: Base_SupportBench.experiment_common.metrics.metric_bundle
performance:
  retrieval_phase_fast: false
  forecast_only_validation: true
  strict_batch_diagnostics: false
diagnostics:
  enabled: true
  sample_every_batches: 25
  max_sampled_batches: 80
  progress_every_batches: 100
