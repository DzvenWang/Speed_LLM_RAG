version: 2.0.3
experiment:
  dataset: TraffiDent_Net_06
  target: speed
  seed: 10
  history: 12
  horizon: 12
  severities: [20, 40, 60, 90]
  max_train_rows: null
  max_val_rows: null
model:
  hidden: 64
backbone:
  injection_layers: [4, 5]  # zero-based STLAformer attention-block indices
  initialized_from_official_checkpoint: true
graph:
  target_region_size: 24
  max_anchors: 32
retrieval:
  key_dim: 128
  coarse_topk: 64
  topk: 8
  utility_score_weight: 0.8
  alignment_steps: 3
  match_on_observed_anchors_only: true
  exclude_overlapping_history_forecast: true
memory:
  max_rows: 50000
  sampling: stratified_temporal # uniformly covers entire training period
  latent_compression_dim: 32
  resident_device: cuda
innovation:
  memory_dim: 32
  rank: 16
  heads: 4
ranking:
  enabled: true
  target_temperature: 0.25
ablation:
  constant_alpha: 0.12
control:
  max_alpha: 0.6
  initial_alpha: 0.12
loss:
  retrieval: 0.4
  state: 0.1
  innovation: 0.03
  direct: 0.5
  tail: 0.03
  gate: 0.0005
  candidate: 0.08
  correction_energy: 0.003
  ranking: 0.15
training:
  batch_size: 16
  num_workers: 2
  grad_clip: 5.0
  weight_decay: 0.0001
  new_lr: 0.0001
  partial_backbone_lr: 0.00001
  full_backbone_lr: 0.000005
  patience: 12
  min_phase_epochs: 5
  phase_epochs:
    retrieval: 20
    recovery: 20
    injection: 35
    partial: 20
    full: 20
  oof_folds: 3
  oof_candidate_epochs: 5
  oof_controller_epochs: 10
  oof_nodes_per_window: 32
  oof_time_gap: 24
evaluation:
  save_stage_predictions: false
  save_final_predictions: true
  auto_test: false

forecast_utility:
  enabled: true
  loss_weight: 0.20
  teacher_temperature: 0.35
  coarse_loss_weight: 0.35
  coarse_temperature: 0.7
  strict_causal_historical_future: true

performance:
  retrieval_phase_fast: true
  forecast_only_validation: true
  strict_batch_diagnostics: false  # set true or FARE_DEBUG_NONFINITE=1 to trace tensors

# Sampling only; no additional model forward or change to loss gradients.
diagnostics:
  enabled: true
  sample_every_batches: 50
  max_sampled_batches: 160
  progress_every_batches: 500
