version: '0.2.1'
method: CoRSTA-MultiMask-ErrorContrast-CF-Residual
experiment:
  target: speed
  dataset: TraffiDent_Net_06
  seed: 10
  severities: [20, 40, 60, 90]
  backbone_mode: incomplete
  history: 12
  horizon: 12
model:
  stla_tail_layers: 2
  cf_dim: 32
  residual_dim: 32
  failure_dim: 16
  attention_heads: 4
  use_road_graph: true
  use_cf_graph: false
  road_neighbors_per_direction: 4
  max_cf_neighbors: 8
  latent_correction_scale: 0.35
  use_failure_embedding: true
  use_cf_error_gate: true
  # The protected STLA including its output head is NEVER fine-tuned.
training:
  stage_epochs: {cf: 10, residual: 10, joint: 8, control: 5}
  patience: 5
  batch_mode: auto
  batch_initial: 64
  batch_choices: [16, 32, 64, 128]
  batch_capacity_fraction: 0.83
  effective_batch: 64
  eval_batch_size: 32
  worker_count: 2
  amp: true
  gradient_clip: 1.0
  lr_cf: 0.0001
  lr_residual: 0.0001
  lr_graph: 0.0001
  lr_controller: 0.0001
  weight_decay: 0.0001
  forecast_rmse_weight: 0.05
  cf_response_weight: 0.06
  cf_latent_weight: 0.01
  residual_semantic_weight: 0.02
  cf_utility_floor: 0.15
  # CF is supervised by how EACH mask changes absolute forecast errors,
  # not just by P_full - P_masked. Additional view is TRAIN-only.
  multimask_error_contrast: true
  cf_error_temperature: 0.35
  cf_error_gain_weight: 0.03
  cf_error_rank_weight: 0.02
  cf_contrast_response_weight: 0.025
  cf_acceptance_weight: 0.02
  selection_limit: 1200
  # TRAIN-only mask augmentation is epoch/sample deterministic.
  augment_training_masks: true
  failure_kinds: [sensor, regional, directional, temporal]
  # Validation scenarios use val raw history only to construct masked input.
  # Never feed unmasked validation history to teacher or Student.
  validation_scenarios_from_val_raw: true
  # Disabled by default: no masked validation s20 can be recovered from s40.
  allow_partial_severity_selection: false
runtime:
  require_cuda_formal: true
  log_utc: true
