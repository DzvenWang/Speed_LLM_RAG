version: "5.3.0"
method: TCRR-STLA
traffic:
  enabled: true
  hidden: 48
  memory_candidate_k: 16
  mask_matched_rerank: true
  horizon_utility: true
  traffic_score_weight: 0.25
  signature_chunk_size: 2048
  graph_neighbors: 8

project:
  root: ${SPEED_LLM_RAG_ROOT}
  backbone_root: ${SPEED_LLM_RAG_ROOT}/Backbone
  supportbench_root: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench
  exp_root: ${SPEED_LLM_RAG_ROOT}/TCRR-STLA_exps/${TRAFFIDENT_TARGET}
  log_root: ${SPEED_LLM_RAG_ROOT}/TCRR-STLA_logs/${TRAFFIDENT_TARGET}
  retrieval_root: ${SPEED_LLM_RAG_ROOT}/TCRR-STLA_cache/${TRAFFIDENT_TARGET}
experiment:
  dataset: TraffiDent_Net_06
  target: ${TRAFFIDENT_TARGET}
  seed: 10
  history: 12
  horizon: 12
  severities: [20, 40, 60, 90]
backbone:
  model: STLAformer
  checkpoint_env: TCRR_STLA_BACKBONE_CHECKPOINT
  reference_seed: 10
  mask_features: [observed, node_coverage, time_coverage, missing_age]
retrieval:
  periods: [4, 2, 1]
  top_k: 12
  shortlist_per_period: 4
  final_candidates: 12
  forecast_pool_batch_size: 16
  history_similarity_weight: 0.55
  replay_batch_size: 64
  temperature: 0.10
  coverage_gamma: 0.5
  query_batch_size: 128
  memory_chunk_size: 2048
  overlap_exclusion: true
  min_valid_features: 8
model:
  period_hidden: 32
  latent_gate_dim: 8
  fusion_hidden: 64
  dropout: 0.10
  none_bias: 1.0
  latent_dim: 16
  max_normalized_correction: 3.0
training:
  batch_size: 64
  fallback_batch_sizes: [64, 48, 32, 16]
  max_epochs: 80
  schedule: frozen
  ablation: full
  patience: 20
  warmup_epochs: 10
  partial_epochs: 35
  partial_last_layers: 2
  lr_new: 0.001
  lr_backbone: 0.00005
  weight_decay: 0.0001
  grad_clip: 5.0
  forecast_loss: mae
  rank_weight: 0.0
  traffic_utility_weight: 0.0
  utility_margin: 0.02
  score_margin: 0.0
  risk_weight: 0.0
  utility_temperature: 0.25
  rmse_weight: 0.05
  retrieval_aux_weight: 0.20
  gate_reg_weight: 0.0005
  min_delta: 0.00000001
runtime:
  eval_batch_size: 8
  num_workers: 4
  val_num_workers: 0
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  preload_retrieval_memory_gpu: false
  frozen_replay_teacher: true
  base_cache_batch_size: 32
  replay_bank_dtype: float32
  replay_bank_on_gpu: false
  normal_teacher_on_gpu: false
  replay_query_batch_size: 12
  gpu_monitor_interval_sec: 30
  amp: true
  amp_dtype: float16
  save_each_epoch: true
  print_every: 100
  # Profiling stats always emitted: per-epoch throughput, peak GPU, peak CPU RSS.
  # Throughput-first defaults: 4 persistent train workers, 0 validation workers.
  # Gadi PBS launcher requests 96GB RAM; monitor memory and throughput.
  # All settings are overridable at qsub submission via environment variables.
  # Test replay caches are opt-in; Validation Replay is always reused.


# TCRR v5 creates all of its own S0, retrieval, normal teacher, and CF replay evidence.
v5:
  s0_epochs: 8
  s0_lr: 0.0003
  c12_epochs: 50
  controller_epochs: 10
  joint_epochs: 0
  temporal_hidden: 16
  support_hidden: 32
  fixed_gate: 0.75
  rank_utility_weight: 0.35
  label_temperature: 0.25
  rank_weight: 0.03
  utility_weight: 0.05
  cf_utility_weight: 0.02
  marginal_utility_weight: 0.01
  auxiliary_weight: 0.15
  scale_utility_weight: 0.05
  save_predictions: false

  # v5.3.0 full-method configuration
  cf_gain_bce_weight: 0.005
  cf_pair_weight: 0.005
  pair_interval: 4
  pair_ground_truth_margin: 0.005
  pair_ranking_margin: 0.05
  marginal_rank_weight: 0.15
  min_calibration_coverage: 0.55
  calibration_stride: 16

  # Automatically run validation research diagnostics after formal training.
  # Negative controls use an identical deterministic validation subset.
  auto_diagnostics: true
  diagnostic_batch_size: 8
  diagnostic_negative_max_batches: 64
  diagnostic_primary_max_batches: 0  # 0 => full validation

  # CRSI: Counterfactual Response-guided Selective Intervention
  # Controls (Normal, Counterfactual) separately; C3 OFF means both gates=1.
  c3_variant: full     # scale | component | agreement | localized | full
  c3_horizon_group_size: 4
  c3_spatial_mix: 0.5
  c3_variant_aux_weight: 0.10
  component_utility_weight: 0.10
  component_harm_weight: 0.02
  joint_harm_weight: 0.04
  gate_spatial_smooth_weight: 0.0005
  c3_local_offset_weight: 0.0002
  gate_temporal_smooth_weight: 0.001
  # Structural regularization uses TRAIN-derived functional neighbors.
  # No future labels enter the forward inference graph.
