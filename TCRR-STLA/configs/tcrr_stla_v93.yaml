version: 9.3.0
method: Full-reference multi-mask counterfactual error-response learning
base_protocol: configs/tcrr_stla_v5.yaml
model:
  mode: incremental              # incremental | decomposed | single
  history: 12
  horizon: 12
  hidden: 64
  correction_bound: 3.0
counterfactual:
  views_per_query: 4           # 1 original official view + 3 deterministic synthetic views
  families: [entry_random, sensor_outage, temporal_outage, regional_outage, directional_outage]
  severities: [20, 40, 60, 90]
  paired_supervision: true
  paired_utility: true
preparation:
  batch_size: 4
  limit: null
  val_limit: null
graph:
  mode: none                   # none | fixed | v7_edge_attention
  road_k: 4
  functional_k: 8
  functional_max_windows: 1024
training:
  batch_size: 32
  eval_batch_size: 16
  workers: 4
  lr: 0.0003
  amp_fp16: true
  clip: 5.0
  train_fraction: 0.90
  epochs:
    residual: 12
    cf_response: 20
    utility: 15
    cf_joint: 12
loss:
  residual_forecast: 1.0
  response: 1.0
  damage: 0.05
  uncertainty: 0.01
  paired: 0.20
  forecast: 1.0
  utility: 0.05
  response_joint: 0.20
  paired_joint: 0.05
  cross_mask_utility: 0.02
