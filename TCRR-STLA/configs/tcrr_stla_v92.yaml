version: 9.2.0
method: Failure-conditioned signed CF transfer and utility with paired intervention auditing
base_protocol: configs/tcrr_stla_v5.yaml
v92:
  candidate_k: 12
  shared_pair_anchors: 4
  replay_dtype: float32
  horizon: 12
  horizon_blocks: 3
  hidden: 32
  cf_hidden: 16
  bound: 3.0
  max_align: 1.5
  temperature: 0.20
  alignment_mode: signed
  graph_mode: gnn_reliability
  temporal_mode: cnn
  null_mode: conditional
  utility_mode: learned
  physical_graph_required: false
  training:
    batch_size: 32
    eval_batch_size: 16
    workers: 4
    prep_batch: 4
    normal_epochs: 12
    align_epochs: 20
    utility_epochs: 20
    joint_epochs: 12
    paired_epochs: 6
    lr: 0.0003
    amp_fp16: true
    utility_weight: 0.02
    rank_weight: 0.01
    alignment_weight: 0.002
    marginal_weight: 0.005
    full_info_weight: 0.01
    cross_weight: 0.01
    compat_weight: 0.01
    clip: 5.0
    patience: 5
  diagnostics:
    auto_after_training: true
    max_queries: 256
    bootstrap_samples: 200
    monitor_epochs: true
    wrong_mask_queries: 32
