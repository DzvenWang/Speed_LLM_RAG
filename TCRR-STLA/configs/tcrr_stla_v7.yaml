version: 7.1.0
method: TCRR-STLA-C12
project:
  root: ${SPEED_LLM_RAG_ROOT}
  backbone_root: ${SPEED_LLM_RAG_ROOT}/Backbone
  supportbench_root: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench
  exp_root: ${SPEED_LLM_RAG_ROOT}/TCRR-STLA_exps/${TRAFFIDENT_TARGET}
  log_root: ${SPEED_LLM_RAG_ROOT}/TCRR-STLA_logs/${TRAFFIDENT_TARGET}
experiment:
  dataset: TraffiDent_Net_06
  target: speed
  seed: 10
  history: 12
  horizon: 12
  severities: [20,40,60,90]
backbone:
  model: STLAformer
  checkpoint_env: TCRR_STLA_BACKBONE_CHECKPOINT
  reference_seed: 10
retrieval:
  periods: [4,2,1]
  shortlist_per_period: 24
  history_similarity_weight: 0.55
  forecast_similarity_weight: 0.15
model:
  hidden: 64
  graph_neighbors: 8
  road_neighbors: 4
  graph_mode: dual
  support_control: full
  reliability_graph: true
  horizon_graph: true
  top_k: 12
  candidate_prediction_temperature: 1.0
  max_normalized_correction: 3.0
training:
  batch_size: 16
  eval_batch_size: 16
  teacher_batch_size: 16
  replay_teacher_batch: 16
  replay_chunk_queries: 32
  s0_learning_rate: 0.0003
  learning_rate: 0.001
  s0_epochs: 8
  normal_epochs: 8
  c1_epochs: 35
  c2_epochs: 18
  joint_c12_epochs: 6
  response_weight: 0.03
  patience: 8
  amp: true
  workers: 4
  grad_accum: 4
  candidate_target_temperature: 0.25
  memory_bank_device: auto
runtime:
  allow_cpu_formal: false
