# TCRR-STLA v9.0.0. Existing Backbone/Base_SupportBench protocol remains v5.3 compatible.
version: 9.1.0
method: Counterfactual-Utility-Guided Residual Transfer
base_protocol: configs/tcrr_stla_v5.yaml
v9:
  candidate_k: 12
  paired_views: 2
  failure_families: [entry_random, sensor_outage, temporal_outage, regional_outage, directional_outage]
  severity_levels: [20, 40, 60, 90]
  full_observation_teacher: true
  teacher_inference: false
  replay_dtype: float32
  replay_prep_batch: 4
  history: 12
  horizon: 12
  horizon_blocks: 3
  query_failure_features: 5
  candidate_match_features: 2
  use_functional_graph: true
  physical_graph_required: false
  use_signed_functional_cf: true
  hidden: 32
  bound: 3.0
  training:
    batch_size: 32
    eval_batch_size: 16
    workers: 4
    normal_epochs: 8
    transfer_epochs: 15
    utility_epochs: 15
    cross_epochs: 4
    lr: 0.0003
    amp_fp16: true
    utility_loss_weight: 0.02
    ranking_loss_weight: 0.01
    full_info_loss_weight: 0.01
    teacher_alignment_loss_weight: 0.005
    cross_failure_loss_weight: 0.01
    patience: 6
    grad_clip: 5.0
  compute:
    gpus: 1
    cpus: 12
    memory_gb: 96
    max_gpu_allocated_gib_target: 26
    replay_reuse: true
    checkpoint_each_epoch: true
