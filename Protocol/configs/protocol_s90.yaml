version: 2.1.0
project:
  root: ${SPEED_LLM_RAG_ROOT}
  protocol_root: ${SPEED_LLM_RAG_ROOT}/Protocol
  artifact_root: ${SPEED_LLM_RAG_ROOT}/Protocol_artifacts
  log_root: ${SPEED_LLM_RAG_ROOT}/Protocol_logs
  supportbench_project: ${SPEED_LLM_RAG_ROOT}/TraffiDent_SupportBench
  benchmark_root: ${SPEED_LLM_RAG_ROOT}/data/processed/traffident/supportbench
  support_artifact_root: ${SPEED_LLM_RAG_ROOT}/artifacts/supportbench
  python: auto

source:
  supportbench_benchmark_version: 1.2.6

experiment:
  dataset: TraffiDent_Net_06
  history: 12
  horizon: 12
  severity: 0.90
  distribution: id
  seed: 10
  families:
    - entry_random
    - sensor_outage
    - temporal_outage
    - regional_outage
    - directional_outage

protocol:
  name: protocol_core5_s90
  role: evaluation_only
  allowed_stages: [evaluation]
  paired_group_id: TraffiDent_Net_06_core5_multiseverity_v1
  paired_reference_severity: 0.40
  paired_evaluation_seed_offset: 20
  unique_view_group: true
  family_balanced: true
  train_only_normalization: true
  normalized_missing_fill_value: 0.0
  evaluation_pool_policy: all_eligible
  evaluation_access_policy: frozen_manifest_direct_access

stages:
  development:
    train_size: 12000
    val_size: 5000
  formal:
    train_size: all
    val_size: 5000
  evaluation:
    test_size: 5000
