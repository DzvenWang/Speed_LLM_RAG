experiment:
  subgraph: TraffiDent_Net_06
  history: 12
  horizon: 12
  seed: 10
  reference_backbone: PatchSTG
  reference_seed: 10
  stage: development

shared_contract:
  config: /scratch/mh20/zw1165/Speed_LLM_RAG/ExperimentCommon/configs/experiment_contract.yaml

runtime:
  amp: false
  num_workers: 4
  prefetch_factor: 3
  persistent_workers: true
  pin_memory: true
  deterministic: true

artifacts:
  backbone_batch_size: 64
  descriptor_batch_size: 512
  node_feature_batch_size: 64
  storage_dtype: float16
  explicit_hidden_module: input_st_fc
  hidden_required: false

candidate_pool:
  candidate_k: 24
  top_k: 8
  search_overfetch: 384
  exclude_interval_steps: 24
  coarse_node_proj_dim: 32
  coarse_mask_proj_dim: 16
  feature_seed: 10

representations:
  evidence_node_proj_dim: 24
  evidence_mask_proj_dim: 16
  backbone_node_proj_dim: 24
  hidden_node_proj_dim: 8
  descriptor_clip: 12.0

future_teacher:
  level_weight: 0.25
  evolution_weight: 0.75
  masked_weight: 0.75
  temperature: 0.20

retriever:
  d_model: 128
  hidden: 256
  dropout: 0.10
  epochs: 14
  patience: 3
  batch_size: 1024
  eval_batch_size: 2048
  lr: 0.0008
  weight_decay: 0.0001
  grad_clip: 5.0
  train_queries: 8000
  train_holdout_queries: 1000
  dev_queries: 1000
  final_val_queries: 2000

forecaster:
  d_model: 96
  state_hidden: 160
  evidence_hidden: 192
  support_hidden: 160
  decoder_hidden: 192
  attention_heads: 4
  attention_batch_chunk: 32768
  dropout: 0.10
  selector_prior_weight: 0.15
  cross_attention_temperature: 1.35
  alpha_init: 0.25
  max_delta_sigma: 3.0
  epochs: 30
  patience: 5
  batch_size: 16
  eval_batch_size: 32
  lr: 0.0008
  weight_decay: 0.0001
  grad_clip: 5.0
  train_queries: 12000
  dev_queries: 1000
  final_val_queries: 2000

loss:
  overall_weight: 1.0
  masked_weight: 2.5
  support_weight: 0.5
  retrieval_branch_aux_weight: 0.75
  attention_entropy_floor: 0.45
  attention_entropy_weight: 0.015
  alpha_smooth_weight: 0.0002
  delta_l1_weight: 0.0001

stage_gate:
  dev_masked_mae_improvement_min_pct: 1.5
  final_masked_mae_improvement_min_pct: 1.0
  stop_dev_below_pct: 0.5

scientific_scope:
  qwen: false
  dual_memory: false
  utility_sign: false
  veto: false
  acceptance: false
  direct_support_transfer: false
