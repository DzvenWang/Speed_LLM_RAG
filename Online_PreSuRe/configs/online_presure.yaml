version: 3.3.0
implementation_revision: 20260924_online_presure_predictive_utility_v33

experiment:
  subgraph: TraffiDent_Net_06
  history: 12
  horizon: 12
  seed: 10
  reference_backbone: PatchSTG
  reference_seed: 10
  manifest_start_column: window_start
  stream_split: val

paths:
  cache_dirname: ExperimentCache
  backbone_dirname: Backbone
  backbone_exp_dirname: Backbone_exps
  common_dirname: ExperimentCommon
  supportbench_dirname: TraffiDent_SupportBench
  benchmark_relpath: data/processed/traffident/supportbench
  exp_dirname: Online_PreSuRe_exps
  log_dirname: Online_PreSuRe_logs
  contract_relpath: ExperimentCommon/configs/experiment_contract.yaml

adaptation:
  trainable: last_block_head
  learning_rate: 8.0e-6
  weight_decay: 1.0e-4
  anchor_lambda: 1.0e-5
  replay_memory_size: 256
  min_memory_cases: 16
  min_mature_cases_for_update: 8
  batch_size: 8
  steps_per_update: 2
  update_every_queries: 1
  grad_clip: 1.0
  save_final_checkpoint: true

evidence_memory:
  capacity: 1024
  min_cases: 16

# Stage-1 candidate discovery only. Final support selection is performed per node x temporal patch.
retrieval:
  prefilter_k: 64
  top_k: 8
  latent_weight: 0.35
  observed_match_weight: 0.25
  complementarity_weight: 0.20
  recency_weight: 0.15
  context_weight: 0.05
  tod_weight: 0.70
  dow_weight: 0.30
  slots_per_day: 288
  recency_tau_steps: 288.0
  observed_match_scale: 0.50
  min_overlap_fraction: 0.10
  score_temperature: 0.15
  nodewise:
    local_observed_match_scale: 0.50

compositional:
  unit: node_temporal_patch
  candidate_pool_k: 64
  temporal_patch_size: 3

# v3.3 causal online predictive-utility scorer.
utility:
  temporal_patch_size: 3
  patch_observed_match_scale: 0.50
  min_patch_overlap_steps: 1
  candidate_consensus_scale: 0.50
  age_scale_steps: 288.0

  # Same patch granularity and candidate pool are used by similarity and utility variants.
  top_k_per_patch: 2
  similarity_fallback_weights:
    latent: 0.10
    global_observed: 0.10
    node_observed: 0.15
    patch_observed: 0.25
    patch_complementarity: 0.25
    recency: 0.10
    context: 0.05

  # Helpful / Neutral / Harmful online classifier.
  hidden_dims: [128, 64]
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  buffer_size: 20000
  min_examples: 256
  min_class_examples: 8
  batch_size: 256
  train_steps_per_update: 4
  train_every_new_labels: 64
  grad_clip: 5.0
  helpful_threshold_pct: 0.05
  harmful_threshold_pct: -0.05
  harmful_penalty: 1.5

  # Selective support + abstention.
  helpful_prob_min: 0.40
  harmful_prob_max: 0.40
  utility_score_min: -0.05
  abstain_when_no_support: true

  # Causal downstream-supervision budget. Probe forecasts are made now; labels appear only after maturity.
  probes_per_query: 12
  probe_top_fraction: 0.50

completion:
  target: artificial_missing_only
  alignment: node_shift
  min_node_overlap_steps: 2
  min_support_cases_per_entry: 1
  min_weighted_coverage: 0.15
  consensus_scale_norm: 0.50
  max_gate: 0.45

fusion:
  scope: direct_and_support
  max_external_weight: 0.45

transition:
  max_gate: 0.0

reasoner:
  mode: none

diagnostics:
  perfect_completion_oracle: true
  retrieved_completion_oracle: true
  entry_oracle_ks: [8, 16, 32, 64]
  retrieval_log_top_k: 8
  patch_support_log_max_per_query: 64

runtime:
  device: auto
  deterministic: true
