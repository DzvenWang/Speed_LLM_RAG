version: 0.1.0
implementation_revision: 20260923_causal_recent_residual_rag_v1

experiment:
  subgraph: TraffiDent_Net_06
  history: 12
  horizon: 12
  seed: 10
  reference_backbone: PatchSTG
  reference_seed: 10
  manifest_start_column: window_start
  stream_split: val

paths:
  cache_dirname: ExperimentCache
  backbone_dirname: Backbone
  backbone_exp_dirname: Backbone_exps
  common_dirname: ExperimentCommon
  supportbench_dirname: TraffiDent_SupportBench
  benchmark_relpath: data/processed/traffident/supportbench
  exp_dirname: Online_PSTG_RAG_exps
  log_dirname: Online_PSTG_RAG_logs
  contract_relpath: ExperimentCommon/configs/experiment_contract.yaml

rag:
  # Dynamic memory contains only online cases whose complete horizon has matured.
  memory_size: 512
  min_memory_cases: 24
  top_k: 8

  # Retrieval score = latent + temporal context + recency.
  latent_weight: 0.70
  context_weight: 0.15
  recency_weight: 0.15
  tod_weight: 0.70
  dow_weight: 0.30
  slots_per_day: 288
  recency_tau_steps: 288.0

  # Weighted retrieval and conservative correction.
  softmax_temperature: 0.12
  alpha: 0.35
  correction_scope: direct_mask   # direct_mask | all
  correction_clip_sigma: 0.75

  # Deterministic confidence gate. No labels or future information are used.
  use_confidence_gate: true
  similarity_gate_center: 0.88
  similarity_gate_scale: 0.04
  disagreement_scale_raw: 3.0

  # Diagnostic only: after the current query is evaluated, report the best
  # single retrieved residual among Top-K. It never affects the RAG prediction.
  oracle_diagnostic: true

runtime:
  device: auto
  deterministic: true
