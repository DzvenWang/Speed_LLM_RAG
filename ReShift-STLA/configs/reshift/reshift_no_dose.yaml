version: reshift-0.1.0
# ABLATION: mechanism B (dose ladder) reduced to the full rung only; retrains shared stages
method: ReShift-FailureReplayedRetrieval-NormalAnchoredCF-DoseLadder-ViewConsistency
experiment:
  target: speed
  dataset: TraffiDent_Net_06
  seed: 10
  severities:
  - 20
  - 40
  - 60
  - 90
  backbone_mode: incomplete
  history: 12
  horizon: 12
model:
  stla_tail_layers: 2
  cf_dim: 32
  residual_dim: 32
  failure_dim: 16
  attention_heads: 4
  use_road_graph: true
  use_cf_graph: false
  road_neighbors_per_direction: 4
  max_cf_neighbors: 8
  latent_correction_scale: 0.35
  use_failure_embedding: true
  use_cf_error_gate: true
  prediction_mode: normal_anchored
  # --- v0.2.3 mechanism B: Counterfactual Dose Ladder -------------------------
  # levels: strictly increasing doses, top rung must be 1.0 (full counterfactual).
  #   Teacher rungs are every level below 1.0 (one extra frozen STLA forward each).
  #   levels: [1.0] is the "no ladder" ablation (binary accept/reject policy).
  # margin: a dose is applied only if its predicted real gain exceeds this (norm. units).
  # temperature: softmax temperature of the soft dose mixture used while the policy
  #   is trained in anchor_control; evaluation always uses the hard argmax.
  dose_ladder:
    enabled: true
    levels: [1.0]
    margin: 0.0
    temperature: 0.01
  # --- v0.2.3 mechanism A: view-consistency reliability -----------------------
  # views: extra degraded views per sample (no-grad forwards; cost ~ views x 1/3 of a train step)
  # drop_fraction: share of currently observed entries removed in each view
  view_consistency:
    enabled: true
    views: 3
    drop_fraction: 0.2
    seed: 10
  # --- ReShift: failure-replayed retrieval arms + outcome-driven arm policy ----
  # arms: cf (one arm per dose rung), ret_res, ret_shift, ret_both, prior
  #   cf        psi_d * Dhat_CF                       (parametric restoration shift)
  #   ret_res   a_r * (r_ret - Rhat_N)                 (retrieved normal residual)
  #   ret_shift Dhat_CF + a_d * (d_ret - Dhat_CF)      (retrieved restoration shift)
  #   ret_both  ret_res + ret_shift
  #   prior     learned mask-conditioned correction WITHOUT retrieval (control arm)
  # use_features: neighbour outcome statistics (incl. leave-one-out harm) feed the policy
  # cf_enabled: false removes the parametric CF shift from every arm (retrieval-only ablation)
  retrieval:
    enabled: true
    arms: [cf, ret_res, ret_shift, ret_both]
    use_features: true
    cf_enabled: true
    tau_init: 0.1
    margin: 0.0
    temperature: 0.01
    hidden: 32
training:
  stage_epochs:
    normal: 10
    anchor_cf: 20
    anchor_ret: 6
    anchor_control: 10
  patience: 5
  batch_mode: auto
  batch_initial: 64
  batch_choices:
  - 16
  - 32
  - 64
  - 128
  batch_capacity_fraction: 0.83
  effective_batch: 64
  eval_batch_size: 32
  worker_count: 2
  amp: true
  gradient_clip: 1.0
  lr_cf: 0.0001
  lr_residual: 0.0001
  lr_graph: 0.0001
  lr_controller: 0.0001
  weight_decay: 0.0001
  forecast_rmse_weight: 0.05
  cf_response_weight: 0.06
  cf_latent_weight: 0.01
  residual_semantic_weight: 0.02
  cf_utility_floor: 0.15
  multimask_error_contrast: true
  cf_error_temperature: 0.35
  cf_error_gain_weight: 0.03
  cf_error_rank_weight: 0.02
  cf_contrast_response_weight: 0.025
  cf_acceptance_weight: 0.02
  selection_limit: 1200
  augment_training_masks: true
  failure_kinds:
  - entry_random
  - sensor
  - temporal
  - regional
  - directional
  validation_scenarios_from_val_raw: true
  allow_partial_severity_selection: false
  multimask_views: 4
  normal_residual_weight: 0.1
  normal_calibration_fraction: 0.12
  normal_calibration_embargo: 24
  normal_calibration_limit: 256
  cf_anchor_gain_weight: 0.05
  cf_anchor_rank_weight: 0.02
  # v0.2.3 dose ladder losses
  dose_response_weight: 0.04   # psi_d * Delta_CF  vs  P_d - P0  (teacher rungs, primary view)
  dose_gain_weight: 0.05       # dose policy -> real gain over the Normal anchor
  dose_gain_scale: 0.1         # robust scaling of gains (normalized units) in the Huber loss
  # ReShift retrieval stages
  lr_retrieval: 0.001
  arm_gain_weight: 0.05        # arm policy -> real gain of each arm over the Normal anchor
  arm_gain_scale: 0.1
# ReShift stage s0: own STLA mask projection (port of the v0.1 bootstrap S0)
s0:
  epochs: 8
  lr: 0.0003
  batch_size: 64
  eval_batch_size: 64
  workers: 2
  amp: true
# Failure-replayed retrieval banks (Train-only memory)
retrieval_bank:
  top_k: 9
  periods: [3]
  min_valid_features: 8
  train_embargo_steps: 288     # Train queries ignore neighbours within +-(24+288) steps
  mask_slots: 2                # fixed Train mask slots used by anchor_ret/anchor_control
  query_batch: 32
  replay_chunk: 64
  workers: 2
  pfull_batch: 64
  memory_chunk: 4096
  memory_on_gpu: true
  bank_on_gpu: false
runtime:
  require_cuda_formal: true
  log_utc: true
