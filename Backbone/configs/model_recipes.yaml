version: 1.1.2
models:
  STAEformer:
    recipe_source: STAEformer/model/STAEformer.yaml:PEMS04
    batch_size: 16
    optimizer: adam
    learning_rate: 0.001
    adam_eps: 1.0e-08
    weight_decay: 0.0005
    scheduler: multistep
    milestones:
    - 15
    - 30
    - 50
    lr_gamma: 0.1
    max_epochs: 300
    patience: 20
    grad_clip: 0.0
    train_loss: huber
    input_dim: 3
    input_embedding_dim: 24
    tod_embedding_dim: 24
    dow_embedding_dim: 24
    spatial_embedding_dim: 0
    adaptive_embedding_dim: 80
    feed_forward_dim: 256
    num_heads: 4
    num_layers: 3
    dropout: 0.1
    use_mixed_proj: true
  HimNet:
    recipe_source: HimNet/model/HimNet.yaml:PEMS03
    batch_size: 16
    optimizer: adam
    learning_rate: 0.001
    adam_eps: 0.001
    weight_decay: 0.0003
    scheduler: multistep
    milestones:
    - 30
    - 50
    lr_gamma: 0.1
    max_epochs: 200
    patience: 20
    grad_clip: 5.0
    train_loss: huber
    hidden_dim: 64
    num_layers: 1
    cheb_k: 2
    tod_embedding_dim: 8
    dow_embedding_dim: 8
    node_embedding_dim: 16
    st_embedding_dim: 16
    tf_decay_steps: 4000
    use_teacher_forcing: true
  BigST:
    recipe_source: BigST/run.py defaults
    batch_size: 16
    optimizer: adam
    learning_rate: 0.001
    adam_eps: 1.0e-08
    weight_decay: 0.0001
    scheduler: multistep
    milestones:
    - 80
    - 100
    lr_gamma: 0.1
    max_epochs: 100
    patience: 30
    grad_clip: 5.0
    train_loss: mae
    hid_dim: 32
    num_layers: 3
    tau: 0.25
    random_feature_dim: 64
    node_dim: 32
    time_dim: 32
    dropout: 0.3
    use_residual: true
    use_bn: true
    use_spatial: false
    use_long: false
  STDN:
    recipe_source: STDN/conf/PEMSD4_1dim_12.conf
    batch_size: 64
    fallback_batch_sizes:
    - 32
    - 16
    optimizer: adam
    learning_rate: 0.001
    adam_eps: 1.0e-08
    weight_decay: 0.0
    scheduler: step
    step_size: 10
    lr_gamma: 0.9
    max_epochs: 200
    patience: 10
    grad_clip: 0.0
    train_loss: mae
    L: 2
    K: 16
    d: 8
    reference: 3
    order: 3
    node_miss_rate: 0.1
    T_miss_len: 12
    bn_decay: 0.1
  PatchSTG:
    recipe_source: PatchSTG/config/SD.conf + main.py (TraffiDent N/time adapted at
      adapter boundary)
    batch_size: 16
    fallback_batch_sizes:
    - 8
    - 4
    optimizer: adamw
    learning_rate: 0.002
    adam_eps: 1.0e-08
    weight_decay: 0.0001
    scheduler: multistep
    milestones:
    - 1
    - 35
    - 40
    lr_gamma: 0.5
    scheduler_step_interval: 1
    max_epochs: 50
    patience: 50
    grad_clip: 0.0
    train_loss: mae
    tem_patchsize: 12
    tem_patchnum: 1
    spatial_recur: 8
    spa_patchsize: 2
    spa_patchnum: 256
    factors: 16
    layers: 5
    input_dims: 64
    node_dims: 64
    tod_dims: 32
    dow_dims: 32
    tod_slots: 288
    dow_slots: 7
    spatial_layout: official_kdtree_on_traffident_nodes_plus_official_adjacency_padding
  STLAformer:
    recipe_source: STLAformer paper Sec. 5.3 + pinned model/STLformer.py defaults
    batch_size: 16
    fallback_batch_sizes:
    - 8
    - 4
    optimizer: adam
    learning_rate: 0.001
    adam_eps: 1.0e-08
    weight_decay: 0.0
    scheduler: plateau
    lr_gamma: 0.1
    max_epochs: 200
    patience: 200
    grad_clip: 0.0
    train_loss: huber
    input_dim: 2
    input_embedding_dim: 32
    tow_embedding_dim: 32
    feed_forward_dim: 256
    num_heads: 4
    num_layers: 6
    dropout: 0.3
    steps_per_week: 2016
    tod_slots: 288
    dow_slots: 7
    input_contract: normalized_target_plus_fractional_time_of_week
    scheduler_patience: 20
    scheduler_threshold: 1.0e-08
