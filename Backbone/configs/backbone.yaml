version: 1.1.7
source:
  supportbench_benchmark_version: 1.2.1
project:
  root: ${SPEED_LLM_RAG_ROOT}
  backbone_root: ${SPEED_LLM_RAG_ROOT}/Backbone
  benchmark_root: ${SPEED_LLM_RAG_ROOT}/data/processed/traffident/base_supportbench/${TRAFFIDENT_TARGET}
  protocol_artifact_root: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/protocol/${TRAFFIDENT_TARGET}
  experimentcommon_root: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench
  cache_root: ${SPEED_LLM_RAG_ROOT}/ExperimentCache/${TRAFFIDENT_TARGET}
  log_root: ${SPEED_LLM_RAG_ROOT}/Backbone_logs/${TRAFFIDENT_TARGET}
  exp_root: ${SPEED_LLM_RAG_ROOT}/Backbone_exps/${TRAFFIDENT_TARGET}
experiment:
  subgraph: TraffiDent_Net_06
  target: ${TRAFFIDENT_TARGET}
  history: 12
  horizon: 12
  development_seed: 10
  formal_seeds:
  - 10
  reference_seed: 10
  evaluation_severities:
  - 20
  - 40
  - 60
  - 90
  families:
  - entry_random
  - sensor_outage
  - temporal_outage
  - regional_outage
  - directional_outage
shared_contract:
  required_version: 1.2.1
  required_cache_schema_version: 3
  data_contract_revision: traffident_experiment_cache_v1
  time_feature_revision: traffident_time_features_v1
  metrics_revision: traffident_metrics_v2
  prediction_contract_revision: traffident_prediction_v1
  protocol_version: 2.1.0
  paired_group_id: TraffiDent_Net_06_base_core5_${TRAFFIDENT_TARGET}_multiseverity_v1
  configs:
    development: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_development.yaml
    formal: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_formal.yaml
    training: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_formal.yaml
    evaluation:
      s20: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_evaluation_s20.yaml
      s40: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_evaluation_s40.yaml
      s60: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_evaluation_s60.yaml
      s90: ${SPEED_LLM_RAG_ROOT}/Base_SupportBench_artifacts/resolved_configs/${TRAFFIDENT_TARGET}/TraffiDent_Net_06/cache_evaluation_s90.yaml
protocol_assertions:
  development:
    train_rows: 12000
    val_rows: 5000
    per_family_train: 2400
    per_family_val: 1000
  formal:
    train_rows: 50000
    val_rows: 5000
    per_family_train: 10000
    per_family_val: 1000
  evaluation:
    test_rows: 5000
    per_family_test: 1000
runtime:
  num_workers: 0
  amp: false
  print_every_batches: 100
  deterministic: true
model:
  name: PatchSTG
  official_source:
    remote: https://github.com/LMissher/PatchSTG.git
    commit: 8b298b230227a304a082e05241c69dca3740a73d
  recipe_source: PatchSTG/config/SD.conf + main.py, adapted only at the TraffiDent
    input boundary
  batch_size: 16
  smoke_batch_size: 2
  fallback_batch_sizes:
  - 8
  - 4
  optimizer: adamw
  learning_rate: 0.002
  adam_eps: 1.0e-08
  weight_decay: 0.0001
  scheduler: multistep
  milestones:
  - 1
  - 35
  - 40
  lr_gamma: 0.5
  scheduler_step_interval: 1
  max_epochs: 50
  patience: 50
  grad_clip: 0.0
  train_loss: mae
  tem_patchsize: 12
  tem_patchnum: 1
  spatial_recur: 8
  spa_patchsize: 2
  spa_patchnum: 256
  factors: 16
  layers: 5
  input_dims: 64
  node_dims: 64
  tod_dims: 32
  dow_dims: 32
  tod_slots: 288
  dow_slots: 7
  spatial_layout: official_kdtree_on_traffident_nodes_plus_official_adjacency_padding
